name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: "v0.73.0"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest
