name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.73.0 PIXI_NO_PATH_UPDATE=1 bash
      - name: Add pixi to PATH
        run: echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Build package
        run: uv build
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
