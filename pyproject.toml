[project]
name = "djdevx"
description = "A cli to improve the development experience for Django projects"
dynamic = ["version"]
authors = [
    {name = "Siavash Outadi", email = "siavash.outadi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer==0.26.8",
    "jinja2==3.1.6",
    "pillow==12.3.0",
    "requests==2.34.2",
    "tomlkit==0.15.0",
    "cryptography==50.0.0",
    "typing-extensions==4.16.0",
    "pyyaml>=6.0.3",
    "rich>=13.0",
    "pydantic[email]>=2.0",
    "python-dotenv>=1.0",
    "questionary>=2.0",
]

[project.scripts]
djdevx = "djdevx.main:app"
ddx = "djdevx.main:app"

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "djdevx/_version.py"

[dependency-groups]
dev = [
    "prek>=0.4.10",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "pyyaml==6.0.3",
    # Pinned to the revs the generated project's prek.toml uses, so the
    # template-formatting guard tests exercise the real formatters.
    "djade==1.9.0",
    "pyupgrade==3.21.2",
]

[tool.pytest.ini_options]
# Run tests in parallel using all available CPU cores
addopts = "-n auto --tb=short --strict-markers --disable-warnings -v"
# -n auto: Automatically detect number of CPUs and run that many workers
# --tb=short: More concise error output
# --strict-markers: Catch typos in pytest markers
# --disable-warnings: Suppress warning messages for cleaner output

# Test discovery patterns
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Optional: Add markers for test organization
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
