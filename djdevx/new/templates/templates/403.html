{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <link rel="stylesheet" href="{% static 'css/errors.css' %}">
</head>
<body>
    <div class="container">
        <svg class="illustration lock" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="50" y="90" width="100" height="70" fill="var(--illustration-fill)" stroke="var(--illustration-stroke)" stroke-width="4" rx="10"/>
            <path d="M70,90 L70,60 Q100,30 130,60 L130,90" fill="none" stroke="var(--illustration-stroke)" stroke-width="4"/>
            <circle cx="100" cy="120" r="10" fill="#e74c3c"/>
        </svg>
        <div class="error-code">Error 403</div>
        <div class="message">Access Denied</div>
        <div class="sub-message">Sorry, you don't have permission to access this page.</div>
        <a href="/" class="home-button">Back to Home</a>
    </div>
</body>
</html>
